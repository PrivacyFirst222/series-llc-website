# The doorman: every push and pull request runs the complete verification —
# typecheck, lint, both test suites (the e2e run's several hundred checks
# against a server booted on a virgin database), and all seven document
# gates — on a clean machine.
# Before this existed, the suite ran only when one person remembered to run
# it on one Mac.
#
# The server is started with E2E_OFFLINE=1: every external integration is
# severed at the environment layer, and the suite itself refuses to run
# against a server with live integrations. No secrets exist in CI, and none
# are needed.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the fix ledger's guard compares the ledger being pushed
      # with the ledger at the commit it replaces.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: webapp
        run: bun install --frozen-lockfile

      - name: Start the API offline on a virgin database
        working-directory: webapp
        run: |
          E2E_OFFLINE=1 bun run server/dev.ts > /tmp/dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/config > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "server never became ready"; cat /tmp/dev-server.log; exit 1

      - name: Run everything
        working-directory: webapp
        env:
          CHECK_RESULTS_FILE: /tmp/server-results.jsonl
          CHECK_COMMIT: ${{ github.sha }}
          CHECK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bun run check

      # The fix ledger's guard (docs/audit): the ledger at this commit against
      # the ledger at the commit it replaces — on a push, the ref's previous
      # tip; on a pull request, the base branch's tip; on a brand-new branch,
      # origin/main's tip, reported as such. If that earlier commit cannot be
      # read, the step FAILS and says so; it never substitutes HEAD^.
      # It does NOT check Adam's acceptance, rejection, ruling or migration
      # records — those are on his Mac, and the local gates read them; nothing
      # on GitHub does.
      - name: The fix ledger's guard, against the ledger being replaced
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then before="$BASE"; echo "pull request: comparing with the base branch at $before"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$'; then before="$BEFORE"; echo "push: comparing with the ref's previous tip $before"
          else before="$(git rev-parse origin/main)"; echo "new branch: comparing with origin/main at $before"; fi
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then echo "the earlier commit $before is not available here — the ledger's transition check could not run"; exit 1; fi
          bun run docs/audit/guard.ts --against "$before..$HEAD_SHA"

      # The behavioral gate (P52): a real Chromium buys every entity variation
      # the site sells — new + conversion, LLC + PLLC, member- + manager-
      # managed, our agent + self agent — and the run passes only when each
      # STORED order matches, field for field, what was chosen on screen.
      # Green means a customer can buy the product, not that our checks agree
      # with our checks.
      - name: Install Chromium for the behavioral gate
        working-directory: webapp
        run: bunx playwright install --with-deps chromium

      - name: A customer buys every product variant
        working-directory: webapp
        env:
          CHECK_RESULTS_FILE: /tmp/walk-results.jsonl
          CHECK_COMMIT: ${{ github.sha }}
          CHECK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bun run behavioral

      # Pages, generated documents and named behaviour checks recorded by
      # accepted fixes. A named check missing from the results counts as failed,
      # and a result counts only from this commit and this run.
      - name: Replay the accepted fixes' assertions
        working-directory: webapp
        run: bun run scripts/audit-assert.ts --results /tmp/server-results.jsonl --results /tmp/walk-results.jsonl --commit ${{ github.sha }} --run ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/dev-server.log
