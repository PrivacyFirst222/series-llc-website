# Uptime watch: pings the live site on a schedule; a failed run makes GitHub
# email the repository owner. Before this, the only outage detector was a
# client's complaint — the 27 Aug API deletion was caught in one minute only
# because a deploy happened to be watched (P45). Scheduled granularity is
# 5-15 minutes at GitHub's discretion; that converts "down silently for a
# day" into "known within minutes."
name: uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Override probe URL (testing the alarm path)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: The site must prove the database answers and ordering is on
        run: |
          URL="${{ github.event.inputs.url }}"
          if [ -z "$URL" ]; then URL="https://myfloridaseriesllc.com/api/health"; fi
          # Status captured and required to be EXACTLY 200: -f does not reject
          # 3xx, and --max-redirs is inert without -L, so a redirect carrying
          # a healthy-shaped body would have passed (OPS-UPTIME-002). The JSON
          # is still parsed structurally (OPS-UPTIME-001).
          RESP=$(curl -s --max-time 20 -w "\n%{http_code}" "$URL") || { echo "SITE DID NOT ANSWER: $URL"; exit 1; }
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')
          [ "$CODE" = "200" ] || { echo "SITE UNHEALTHY: HTTP $CODE — $BODY"; exit 1; }
          echo "$BODY" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["data"]
          assert d["ok"] is True and d["database"] is True and d["ordering"] is True, d
          ' || { echo "SITE ANSWERED WRONG: $BODY"; exit 1; }
          echo "healthy: $BODY"
